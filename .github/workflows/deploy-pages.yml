name: Deploy site and quote proxy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: simulabolsa-deploy
  cancel-in-progress: true

jobs:
  deploy_quote_worker:
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check Cloudflare deployment settings
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out repository
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        if: steps.cloudflare.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy
      - name: Explain skipped Worker deployment
        if: steps.cloudflare.outputs.configured != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets to deploy the quote proxy."

  deploy_pages:
    needs: deploy_quote_worker
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Configure quote proxy URL
        env:
          BRAPI_PROXY_URL: ${{ needs.deploy_quote_worker.outputs.deployment_url }}
        run: node scripts/write-quote-config.mjs
      - name: Upload website files
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
